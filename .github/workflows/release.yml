name: Package and release

# Annotated tags only. A lightweight tag (git tag v1.2.3) will not produce a
# usable release - use git tag -a v1.2.3 -m "v1.2.3".
#
# Version tags only, too. This was '**' until 1.26.27, and a throwaway tag
# named "prime" pushed to test credentials cut a full release and uploaded a
# file called prime-mists to CurseForge.
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Clone project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # No -g since 1.27.0. The packager reads every TOC in the repo and
      # tags the upload from them: MoP Classic 5.5.4 off WayBook.toc, Retail
      # 12.0.7 and 12.1.0 off WayBook_Mainline.toc. It was pinned to 5.5.4
      # while the Retail build had never been loaded on a Retail client;
      # both flavors were tested on 2026-08-16.
      - name: Package and release
        uses: BigWigsMods/packager@v2
